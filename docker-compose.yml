services:
  mysql8:
    container_name: mysql8
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS}
    volumes:
      - data-mysql:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql
    restart: unless-stopped
    #networks:
    #  - intitech-network
  postgres15:
    container_name: postgres15
    image: postgres:15-alpine
    ports:
      - "5532:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${MSVC_USERS_DB}
    volumes:
      - data-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    #networks:
    #  - intitech-network
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASS}
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - data-mongodb:/data/db
      - config-mongodb:/data/configdb
    networks:
      - intitech-network
  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASS}
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS}
    depends_on:
      - mongodb
    networks:
      - intitech-network
  auth-service:
    container_name: auth-service
    build:
      context: ./
      dockerfile: ./auth-service/Dockerfile
    env_file: .env
    networks:
      - intitech-network
    depends_on:
      - discovery-eureka
    restart: always
  discovery-eureka:
    container_name: discovery-eureka
    build:
      context: ./
      dockerfile: ./discovery-eureka/Dockerfile
    env_file: .env
    ports:
      - "8761:8761"
    networks:
      - intitech-network
    restart: always
  gateway-service:
    container_name: gateway-service
    build:
      context: ./
      dockerfile: ./gateway-service/Dockerfile
    env_file: .env
    ports:
      - "8090:8090"
    networks:
      - intitech-network
    depends_on:
      - discovery-eureka
    restart: always
  msvc-blog:
    container_name: msvc-blog
    build:
      context: ./
      dockerfile: ./msvc-blog/Dockerfile
    env_file: .env
    networks:
      - intitech-network
    depends_on:
      - discovery-eureka
      - mongodb
    restart: always
  msvc-cart:
    container_name: msvc-cart
    build:
      context: ./
      dockerfile: ./msvc-cart/Dockerfile
    env_file: .env
    networks:
      - intitech-network
    depends_on:
      - discovery-eureka
      - mysql8
    restart: always
  msvc-coupon:
